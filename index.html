<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumos Maxima - 万家灯火 (高密度优化版)</title>
    
    <!-- 引入外部 CSS 文件 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- 动态星空背景 -->
    <div id="stars"></div>

    <!-- 顶部标题 -->
    <div class="title-container">
        LUMOS MAXIMA
        <span>TO WINDOWS AWAKE</span>
    </div>

    <!-- 建筑群 -->
    <div id="buildings-container">
        <div class="building b1"><div class="windows-wrapper" data-cols="3" data-rows="5"></div></div>
        <div class="building b2"><div class="windows-wrapper" data-cols="4" data-rows="3"></div></div>
        <div class="building b3"><div class="windows-wrapper" data-cols="3" data-rows="7"></div></div>
        <div class="building b4"><div class="windows-wrapper" data-cols="3" data-rows="9"></div></div>
        <div class="building b5"><div class="windows-wrapper" data-cols="4" data-rows="5"></div></div>
        <div class="building b6"><div class="windows-wrapper" data-cols="3" data-rows="5"></div></div>
        <div class="building b7"><div class="windows-wrapper" data-cols="4" data-rows="6"></div></div>
    </div>

    <!-- 摄像头小窗 -->
    <div id="video-container">
        <video class="input_video"></video>
    </div>
    <canvas class="output_canvas"></canvas>

    <!-- 操作提示 -->
    <div id="gesture-hint">
        👌 <b>捏合食指与拇指</b>：点亮/熄灭窗口<br>
        🖐️ <b>单手张开</b>：点亮交错闪烁<br>
        ✊✊ <b>双手握拳</b>：所有灯光缓缓熄灭
    </div>

    <!-- 引入外部 JS 文件 -->
    <script src="script.js"></script>
</body>
</html>
