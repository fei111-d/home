<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumos Maxima - 万家灯火 (清透亮色版)</title>
    
    <!-- 引入外部 CSS 文件 -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="stars"></div>
    <div id="twinkling-stars"></div>

    <div class="title-container">
        LUMOS MAXIMA
        <span>TO WINDOWS AWAKE</span>
    </div>

    <!-- 手部指示箭头 -->
    <div id="hand-cursor">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 2L20 11.5L12.5 13.5L16.5 21L13.5 22.5L9.5 15L4 20.5V2Z" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
    </div>

    <!-- 建筑群 -->
    <div id="buildings-container">
        <div class="building b1">
            <div class="windows-wrapper" data-rows="5"></div>
            <div class="door"></div>
        </div>
        <div class="building b2">
            <div class="windows-wrapper" data-rows="6"></div>
            <div class="door"></div>
        </div>
        <div class="building b3">
            <div class="windows-wrapper" data-rows="4"></div>
            <div class="door"></div>
        </div>
        <div class="building b4">
            <div class="windows-wrapper" data-rows="8"></div>
            <div class="door"></div>
        </div>
        <div class="building b5">
            <div class="windows-wrapper" data-rows="5"></div>
            <div class="door"></div>
        </div>
        <div class="building b6">
            <div class="windows-wrapper" data-rows="7"></div>
            <div class="door"></div>
        </div>
        <div class="building b7">
            <div class="windows-wrapper" data-rows="6"></div>
            <div class="door"></div>
        </div>
    </div>

    <!-- 摄像头小窗 -->
    <div id="video-container">
        <video class="input_video"></video>
    </div>
    <canvas class="output_canvas"></canvas>

    <!-- 操作提示 -->
    <div id="gesture-hint">
        👌 <b>捏合食指与拇指</b>：点亮/熄灭窗口<br>
        🖐️ <b>单手张开</b>：点亮交错闪烁<br>
        ✊✊ <b>双手握拳</b>：所有灯光缓缓熄灭
    </div>

    <!-- 引入外部 JS 文件 -->
    <script src="script.js"></script>
</body>
</html>
