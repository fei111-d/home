<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumos Maxima - 手势交互万家灯火</title>
    
    <!-- 引入外部 CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 引入 MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- 星空背景 -->
    <div id="stars"></div>

    <!-- 顶部标题 -->
    <div class="title-container">
        <div>L U M O S &nbsp;&nbsp; M A X I M A</div>
        <div style="font-size: 10px; opacity: 0.5; margin-top: 5px;">TO WINDOWS AWAKE</div>
    </div>

    <!-- 建筑群容器 -->
    <div id="buildings-container">
        <!-- 建筑将通过 JS 动态生成 -->
    </div>

    <!-- 摄像头小窗 -->
    <div id="video-container">
        <video class="input_video"></video>
    </div>
    
    <!-- 隐藏辅助Canvas -->
    <canvas class="output_canvas"></canvas>

    <!-- 操作提示 -->
    <div id="gesture-hint">
        <p>👌 <span class="highlight">在窗户位置捏合拇指与食指</span>: 开灯/关灯 (随机颜色)</p>
        <p>🖐️ <span class="highlight">单手五指张开</span>: 已点亮的窗户交错闪烁</p>
        <p>👊👊 <span class="highlight">双手握拳</span>: 所有灯光逐渐熄灭</p>
    </div>

    <!-- 引入外部 JS -->
    <script src="script.js"></script>
</body>
</html>
